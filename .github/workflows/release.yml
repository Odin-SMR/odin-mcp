name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub release packages
    needs: validate
    if: github.repository == 'Odin-SMR/odin-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Verify release identity, main ancestry and unchanged artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG" --require-main --verify-checksums
      - name: Publish the tested wheel, source archive and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          --verify-tag --title "$RELEASE_TAG" --generate-notes
