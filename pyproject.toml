[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "odin-mcp"
version = "0.2.0"
description = "MCP server for Odin Level 2 data access and source-linked research guidance"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Odin", "SMR", "atmospheric-science", "MCP"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1.30.0,<2",
    # PyArrow uses pandas.Timestamp to preserve non-microsecond timestamp[ns] values.
    "pandas>=2.2,<4",
    "pyarrow>=18.0.0",
]

[project.urls]
Repository = "https://github.com/Odin-SMR/odin-mcp"
Documentation = "https://github.com/Odin-SMR/odin-mcp#readme"
Issues = "https://github.com/Odin-SMR/odin-mcp/issues"

[project.scripts]
odin-mcp = "odin_mcp.server:run"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["odin_mcp"]
namespaces = false

[tool.setuptools.package-data]
odin_mcp = ["research/*.md", "research/*.json"]

[dependency-groups]
test = ["pytest>=8.3,<10"]
build = [
    "build>=1.2,<2",
    "twine>=6,<7",
    "setuptools>=77",
    "wheel>=0.45",
]
dev = [{include-group = "test"}, {include-group = "build"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
